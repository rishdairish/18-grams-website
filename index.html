/* -------------------------------- HELPERS -------------------------------- */

function useScrollProgress() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const scrollTop = h.scrollTop || document.body.scrollTop;
      const scrollHeight = (h.scrollHeight || document.body.scrollHeight) - h.clientHeight;
      setProgress(scrollHeight > 0 ? Math.min(1, scrollTop / scrollHeight) : 0);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return progress;
}

function DoseDial({ progress, size = 56, dark }) {
  // "18g dial" signature element — a dosing-scale dial that reads scroll position
  const c = dark ? DARK : COLORS;
  const angle = -130 + progress * 260;
  const ticks = Array.from({ length: 12 });
  return (
    <div className="relative flex items-center justify-center shrink-0" style={{ width: size, height: size }}>
      <svg viewBox="0 0 100 100" width={size} height={size}>
        <circle cx="50" cy="50" r="46" fill={c.creamDeep} stroke={c.coffee} strokeWidth="1.5" opacity="0.9" />
        {ticks.map((_, i) => {
          const a = (-130 + (i / 11) * 260) * (Math.PI / 180);
          const x1 = 50 + 38 * Math.cos(a), y1 = 50 + 38 * Math.sin(a);
          const x2 = 50 + 43 * Math.cos(a), y2 = 50 + 43 * Math.sin(a);
          return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={c.coffee} strokeWidth="1" opacity="0.6" />;
        })}
        <line
          x1="50" y1="50"
          x2={50 + 32 * Math.cos((angle * Math.PI) / 180)}
          y2={50 + 32 * Math.sin((angle * Math.PI) / 180)}
          stroke={c.sageDeep} strokeWidth="2.5" strokeLinecap="round"
          style={{ transition: "all 120ms linear" }}
        />
        <circle cx="50" cy="50" r="4" fill={c.sageDeep} />
        <text x="50" y="72" textAnchor="middle" fontSize="11" fill={c.charcoal} fontFamily="Playfair Display, serif" fontWeight="700">18g</text>
      </svg>
    </div>
  );
}

function StarRow({ value, size = 16, onRate }) {
  return (
    <div className="flex gap-0.5">
      {[1, 2, 3, 4, 5].map((n) => (
        <Star
          key={n}
          size={size}
          className={onRate ? "cursor-pointer" : ""}
          fill={n <= value ? "#C9973B" : "none"}
          stroke={n <= value ? "#C9973B" : "#B8AA8E"}
          onClick={onRate ? () => onRate(n) : undefined}
        />
      ))}
    </div>
  );
}

              <input placeholder="Email" className="p-3 rounded-xl text-sm outline-none" style={{ background: c.creamDeep, border: `1px solid ${c.sage}` }} />
              <textarea placeholder="Message" rows={4} className="p-3 rounded-xl text-sm outline-none resize-none" style={{ background: c.creamDeep, border: `1px solid ${c.sage}` }} />
              <button className="py-3 rounded-full font-semibold text-sm" style={{ background: c.coffee, color: "#fff" }}>Send message</button>
            </div>
            <div className="mt-6 pt-6 border-t" style={{ borderColor: c.creamDeep }}>
              <h4 className="text-sm font-semibold mb-2">Newsletter</h4>
              {newsletterDone ? (
                <p className="text-sm" style={{ color: c.sageDeep }}>Thanks — you're on the list.</p>
              ) : (
                <div className="flex gap-2">
                  <input value={newsletterEmail} onChange={(e) => setNewsletterEmail(e.target.value)} placeholder="you@email.com" className="flex-1 p-2.5 rounded-full text-sm outline-none" style={{ background: c.creamDeep, border: `1px solid ${c.sage}` }} />
                  <button onClick={() => newsletterEmail.trim() && setNewsletterDone(true)} className="px-4 rounded-full text-xs font-semibold" style={{ background: c.sage, color: "#fff" }}>Join</button>
                </div>
              )}
            </div>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="text-center py-8 text-xs opacity-60" style={{ background: c.cream }}>
        © {new Date().getFullYear()} 18 Grams Café. Westfield Eastgardens, Sydney.
      </footer>

      {/* Back to top */}
      {showBackToTop && (
        <button onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} className="fixed bottom-20 right-5 w-11 h-11 rounded-full flex items-center justify-center shadow-lg z-[60]" style={{ background: c.coffee, color: "#fff" }}>
          <ArrowUp size={18} />
        </button>
      )}

      {/* Cookie consent */}
      {cookieVisible && (
        <div className="fixed bottom-0 left-0 w-full z-[80] px-5 py-4 flex flex-col sm:flex-row items-center gap-3 justify-between" style={{ background: c.charcoal, color: c.cream }}>
          <p className="text-xs opacity-90">We use cookies to improve your experience on this demo site.</p>
          <button onClick={() => setCookieVisible(false)} className="px-4 py-1.5 rounded-full text-xs font-semibold shrink-0" style={{ background: c.sage, color: "#fff" }}>Accept</button>
        </div>
      )}

      <style>{`
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        html { scroll-behavior: smooth; }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }
      `}</style>
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
